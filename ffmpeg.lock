# Pinned ffmpeg revision.
#
# ffprobe has no repository of its own -- it is built from this same tree, so
# pinning here pins both binaries to one commit. `make ffmpeg` refuses to build
# if the checkout does not match.
#
# Why pin at all: `git clone --depth 1` takes whatever HEAD happens to be that
# day, so two machines building a month apart get different decoders. Analysis
# output is only comparable across runs if the decoder is identical, and this
# project's numbers (frame timing, reconstruction error) are the deliverable.
#
# To move: change `commit`, run `make ffmpeg-update`, and re-check any measured
# figures recorded in docs/.

